name: FontBakery QA Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fontbakery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install QA Tooling
        run: |
          python -m pip install --upgrade pip
          pip install "fontbakery[googlefonts]"

      - name: Run FontBakery on TTF Fonts
        run: |
          fontbakery check-googlefonts fonts/ttf/*.ttf --html fontbakery-report.html || true

      - name: Upload QA Report
        uses: actions/upload-artifact@v4
        with:
          name: fontbakery-qa-report
          path: fontbakery-report.html
